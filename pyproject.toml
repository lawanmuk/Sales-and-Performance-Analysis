[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-analysis"
version = "1.0.0"
description = "Sales performance analysis of the Superstore dataset"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mukhtar Lawan" }]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2.3",
    "plotly>=6.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50"]

sql = ["duckdb>=1.1"]
dev = [
    "sales-analysis[dashboard,sql]",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[project.scripts]
sales-analysis = "sales_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sales_analysis = ["queries/*.sql"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:streamlit.*",
    "ignore::DeprecationWarning:seaborn.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sales_analysis"]
